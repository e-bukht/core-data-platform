services:
  postgres18:
    image: postgres:18
    environment:
      POSTGRES_DB: coredata
      POSTGRES_USER: coredata
      POSTGRES_PASSWORD: local-only
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coredata -d coredata"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pg18-data:/var/lib/postgresql

  postgres12:
    image: postgres:12.22
    profiles: ["compat"]
    environment:
      POSTGRES_DB: coredata
      POSTGRES_USER: coredata
      POSTGRES_PASSWORD: local-only
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coredata -d coredata"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pg18-data: