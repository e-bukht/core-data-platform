name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"
      - name: Require committed lockfile
        run: test -f uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration and not compatibility"
      - run: uv run pip-audit
      - run: uv run bandit -q -r src
      - name: Generate CycloneDX SBOM
        run: mkdir -p .sbom && uv run cyclonedx-py environment --output-format JSON --output-file .sbom/sbom.json
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: .sbom/sbom.json

  postgres-matrix:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12.22", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: coredata
          POSTGRES_USER: coredata
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coredata -d coredata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORE_PLATFORM_ENVIRONMENT: ci
      CORE_PLATFORM_DATABASE_URL: postgresql+psycopg://coredata:ci-only@localhost:5432/coredata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"
      - run: test -f uv.lock
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration/test_configured_database.py
